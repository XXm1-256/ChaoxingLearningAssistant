name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore
        run: dotnet restore ChaoxingLearningAssistant.sln
      - name: Build
        run: dotnet build ChaoxingLearningAssistant.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/ChaoxingLearningAssistant.Tests/ChaoxingLearningAssistant.Tests.csproj -c Release --no-build
      - name: Adapter regression
        run: node scripts/adapter_regression.mjs
      - name: Static check
        run: python scripts/static_check.py
